name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # main 只接受 dev 的合并(分支与合并规范,CLAUDE.md):head 不是 dev 直接红,
  # required status check 锁住绕行路径
  merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: main only accepts merges from dev
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ] && [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "::error::PR into main must come from dev (got: ${{ github.event.pull_request.head.ref }})" >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    # 核心与渲染层是纯逻辑,windows 之外也能测,开发主循环在 mac 上跑
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p mica-core -p mica-render --all-targets -- -D warnings
      - run: cargo test -p mica-core -p mica-render

  msi:
    # M3c(D23):cargo-wix 打包 MSI artifact;candle/light 由 choco 提供。
    # 打包失败不红主 CI(installer optional)——改成 always() 条件由 artifact 落地
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1 --no-progress -y
      - name: Add WiX to PATH
        shell: pwsh
        run: echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" | Out-File -Append $env:GITHUB_PATH
      - name: Build MSI
        run: |
          cargo install cargo-wix --locked
          cargo wix -p mica-app --output target/wix/mica.msi
      - uses: actions/upload-artifact@v4
        with:
          name: mica-msi
          path: target/wix/mica.msi
          if-no-files-found: warn
