# 依赖机器人:每周扫 Cargo 依赖与 GitHub Actions 版本,提 PR 更新
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/crates/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
