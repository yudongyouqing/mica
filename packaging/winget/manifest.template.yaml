ShortDescription: Windows-native terminal emulator built in Rust.
PackageUrl: https://github.com/yudongyouqing/mica
Installers:
  - Architecture: x64
    InstallerUrl: <URL>
    InstallerType: wix
    InstallerSha256: 578e757b022e3d93468e83e89c9c5d207b37a38af2a1cb4b272392b06780f378
    InstallerSwitches:
      Silent: /qn
      SilentWithProgress: /qb
ManifestType: singleton
